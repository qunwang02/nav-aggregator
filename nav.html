<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>导航聚合页</title>
    <script>
        (function() {
            const isAuthenticated = localStorage.getItem("authenticated");
            const authTime = localStorage.getItem("authTime");
            const AUTH_VALIDITY_HOURS = 24;

            console.log("[Debug] isAuthenticated:", isAuthenticated);
            console.log("[Debug] authTime:", authTime);
            console.log("[Debug] 当前时间:", Date.now());

            const isValid = isAuthenticated === "true" &&
                           authTime &&
                           (Date.now() - parseInt(authTime) < AUTH_VALIDITY_HOURS * 60 * 60 * 1000);

            console.log("[Debug] isValid:", isValid);

            if (!isValid) {
                sessionStorage.removeItem("authenticated");
                sessionStorage.removeItem("authTime");
                sessionStorage.removeItem("sessionToken");
                window.location.href = "/?from=nav&reason=" + (isAuthenticated ? "expired" : "not_auth");
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 32px;
            max-width: 560px;
            width: 100%;
            padding: 32px 24px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin-top: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 三张登记项目卡片 */
        .project-card {
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 18px 18px 14px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .project-title {
            font-size: 17px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-title .emoji {
            font-size: 20px;
        }

        /* 移动端 / 电脑端按钮 */
        .entry-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .entry-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .entry-btn .label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .entry-btn .arrow {
            font-size: 18px;
        }

        /* 手机端按钮 - 蓝色 */
        .entry-btn.mobile {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }
        .entry-btn.mobile:hover {
            background: #1d4ed8;
            color: white;
            border-color: #1d4ed8;
            transform: translateY(-2px);
        }

        /* 电脑端按钮 - 绿色 */
        .entry-btn.desktop {
            background: #ecfdf5;
            color: #047857;
            border-color: #a7f3d0;
        }
        .entry-btn.desktop:hover {
            background: #047857;
            color: white;
            border-color: #047857;
            transform: translateY(-2px);
        }

        /* Via 浏览器建议 */
        .via-banner {
            background: #fef3c7;
            border-radius: 16px;
            padding: 14px 18px;
            margin-top: 4px;
            border-left: 4px solid #f59e0b;
        }
        .via-banner p {
            font-size: 13px;
            color: #92400e;
            margin-bottom: 8px;
        }
        .via-banner a {
            color: #d97706;
            font-weight: 600;
            text-decoration: none;
            font-size: 13px;
        }
        .via-banner a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            padding-top: 20px;
            margin-top: 12px;
            border-top: 1px solid #f3f4f6;
        }
        .logout {
            text-align: center;
            margin-top: 14px;
        }
        .logout a {
            font-size: 12px;
            color: #9ca3af;
            text-decoration: none;
        }
        .security-badge {
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

        <!-- 浏览器建议 -->

        </div>
        <div class="logout">

        </div>
        <div class="security-badge">
            🔒 安全验证已启用
        </div>
    </div>

    <script>
        function logout() {
            if (confirm("确定要退出登录吗？")) {
                localStorage.removeItem("authenticated");
                localStorage.removeItem("authTime");
                localStorage.removeItem("sessionToken");
                window.location.href = "/";
            }
        }
    </script>
</body>
</html>
